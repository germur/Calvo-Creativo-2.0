[build]
  command = "npm run build && npm run verify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.11.1"

[[headers]]
  for = "/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[edge_functions]]
  function = "gone"
  path = "/services/*"
